<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kindle Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script>document.documentElement.classList.add("js")</script>
<style>
/* Field manual: a fixed index rail on the left, one page at a time in a ~70ch column;
   function signatures sit on their own tinted plates. Ash greys, one ember-gold accent. */
:root {
  --bg: #eceef0;
  --surface: #f6f7f8;
  --plate: #e3e7ea;
  --ink: #1b1f24;
  --muted: #59626d;
  --rule: #d0d6db;
  --accent: #94580b;
  --accent-soft: #f1e3cc;
  --code-kw: #7a3e9d;
  --code-str: #2f6b3f;
  --code-com: #7b848d;
  --code-num: #9c4a12;
  --code-fn: #1f5f8b;
  --display: "EB Garamond", "Garamond", "Iowan Old Style", Georgia, serif;
  --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --rail: 17rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171b; --surface: #1a1e23; --plate: #20252b; --ink: #e5e1d9; --muted: #98a1ab;
    --rule: #2b3139; --accent: #e3a650; --accent-soft: #3a2d1a;
    --code-kw: #c9a2e6; --code-str: #9ccf9f; --code-com: #7d8792; --code-num: #f0b47a; --code-fn: #8cc4ec;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171b; --surface: #1a1e23; --plate: #20252b; --ink: #e5e1d9; --muted: #98a1ab;
  --rule: #2b3139; --accent: #e3a650; --accent-soft: #3a2d1a;
  --code-kw: #c9a2e6; --code-str: #9ccf9f; --code-com: #7d8792; --code-num: #f0b47a; --code-fn: #8cc4ec;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.65 var(--body); }
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:hover { text-decoration-thickness: 2px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }

.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh; }

/* rail */
.rail {
  position: sticky; top: env(safe-area-inset-top, 0px); align-self: start;
  height: 100vh; overflow-y: auto; padding: 1.75rem 1.25rem 2rem;
  border-right: 1px solid var(--rule); background: var(--surface);
  display: flex; flex-direction: column; gap: 1.1rem;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: .5rem; text-decoration: none; color: var(--ink); }
.brand-name { font: 600 1.9rem/1 var(--display); letter-spacing: .01em; }
.brand-ver { font: 500 .7rem/1 var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; }
.search { position: relative; }
.search input {
  width: 100%; font: 400 .9rem var(--body); color: var(--ink); background: var(--bg);
  border: 1px solid var(--rule); border-radius: 6px; padding: .5rem .65rem;
}
.search input::placeholder { color: var(--muted); }
.results { list-style: none; margin: .4rem 0 0; padding: .25rem; border: 1px solid var(--rule); border-radius: 6px; background: var(--bg); }
.results a { display: flex; justify-content: space-between; gap: .75rem; padding: .3rem .45rem; border-radius: 4px; text-decoration: none; color: var(--ink); font-size: .87rem; }
.results a span { color: var(--muted); font: .75rem var(--mono); white-space: nowrap; }
.results a:hover, .results a.hot { background: var(--accent-soft); }
.results .none { padding: .3rem .45rem; color: var(--muted); font-size: .87rem; }
.nav-group { margin: .4rem 0 .3rem; font: 600 .7rem/1 var(--body); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
nav ul { list-style: none; margin: 0 0 .6rem; padding: 0; display: grid; gap: 1px; }
nav a { display: block; padding: .28rem .55rem; border-radius: 4px; color: var(--ink); text-decoration: none; font-size: .92rem; }
nav a.mono { font: .84rem var(--mono); }
nav a:hover { background: var(--plate); }
nav a.current { background: var(--accent-soft); color: var(--ink); font-weight: 600; }

/* pages */
main { padding-block: 2.5rem 5rem; padding-inline: clamp(16px, 5vw, 4rem); min-width: 0; }
.page { max-width: 46rem; }
.js .page { display: none; }
.js .page.active { display: block; }
.page > h1 { font: 600 2.6rem/1.1 var(--display); margin: 0 0 1rem; text-wrap: balance; letter-spacing: .005em; }
.page > h1 code { font: inherit; background: none; padding: 0; }
.page h2 { font: 600 1.3rem/1.3 var(--body); margin: 2.6rem 0 .8rem; padding-top: 1.2rem; border-top: 1px solid var(--rule); text-wrap: balance; }
.page h3 { font: 600 1.05rem/1.35 var(--body); margin: 2rem 0 .6rem; }
.page h4 { font: 600 .95rem/1.4 var(--body); margin: 1.4rem 0 .5rem; }
.page p, .page li { max-width: 68ch; }
.page p { margin: 0 0 .9rem; }
.page ul, .page ol { margin: 0 0 1rem; padding-left: 1.3rem; display: grid; gap: .3rem; }
.page strong { font-weight: 600; }
code { font: .86em var(--mono); background: var(--plate); padding: .08em .32em; border-radius: 3px; overflow-wrap: anywhere; }
a code { color: inherit; }
.page blockquote { margin: 0 0 1rem; display: inline-block; font-size: .88rem; background: var(--accent-soft); padding: .3rem .65rem; border-radius: 4px; }
.page blockquote p { margin: 0; }
.page blockquote code { background: transparent; padding: 0; }

pre.code { margin: 0 0 1.2rem; padding: .85rem 1rem; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px; overflow-x: auto; font: .84rem/1.6 var(--mono); }
pre.code code { background: none; padding: 0; font: inherit; overflow-wrap: normal; }
/* a function's signature: the plate right under its heading */
.page h3 + pre.code { background: var(--plate); border-color: transparent; }

.table { overflow-x: auto; margin: 0 0 1.3rem; border: 1px solid var(--rule); border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: .9rem; }
th, td { text-align: left; vertical-align: top; padding: .5rem .75rem; border-bottom: 1px solid var(--rule); }
th { font: 600 .72rem/1.3 var(--body); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td code { white-space: nowrap; }

/* code highlighting */
.k { color: var(--code-kw); }
.s { color: var(--code-str); }
.c { color: var(--code-com); font-style: italic; }
.m { color: var(--code-num); }
.nf { color: var(--code-fn); }

.foot { margin-top: 3.5rem; padding-top: 1rem; border-top: 1px solid var(--rule); color: var(--muted); font-size: .82rem; max-width: 46rem; }

@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--rule); padding: 1.1rem 16px 1rem; gap: .8rem; }
  nav { display: flex; flex-wrap: wrap; gap: .2rem .9rem; }
  nav .nav-group { flex-basis: 100%; margin: .3rem 0 0; }
  nav ul { display: flex; flex-wrap: wrap; gap: .2rem; margin: 0; }
  nav a { padding: .2rem .5rem; border: 1px solid var(--rule); }
  main { padding-block: 1.75rem 4rem; }
  .page > h1 { font-size: 2.1rem; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
</head>
<body>

<div class="shell">
  <aside class="rail">
    <a class="brand" href="#home"><span class="brand-name">Kindle</span><span class="brand-ver">DS3 1.15.2</span></a>
    <div class="search">
      <input id="q" type="search" placeholder="Search functions and guides" aria-label="Search functions and guides" autocomplete="off">
      <ul class="results" id="results" hidden></ul>
    </div>
    <nav aria-label="Documentation">
{{NAV}}
    </nav>
  </aside>
  <main id="main">
{{PAGES}}
    <p class="foot">Kindle {{VERSION}}. The reference is generated from the type stubs that power editor autocomplete, so the two always match.</p>
  </main>
</div>

<script>
const SEARCH = {{SEARCH}};
const pages = [...document.querySelectorAll(".page")];
const navLinks = [...document.querySelectorAll("[data-nav]")];

function show() {
  const id = decodeURIComponent(location.hash.slice(1)) || "home";
  let target = document.getElementById(id);
  let page = target && target.closest(".page");
  if (!page) { page = document.getElementById("page-home"); target = null; }
  for (const p of pages) p.classList.toggle("active", p === page);
  const slug = page.dataset.slug;
  for (const a of navLinks) a.classList.toggle("current", a.dataset.nav === slug);
  if (target && target.tagName !== "H1") target.scrollIntoView();
  else window.scrollTo(0, 0);
}
addEventListener("hashchange", show);
show();

const q = document.getElementById("q");
const results = document.getElementById("results");
let hot = 0;
function renderResults() {
  const term = q.value.trim().toLowerCase();
  if (!term) { results.hidden = true; return; }
  const hits = SEARCH.filter(e => e.t.toLowerCase().includes(term))
    .sort((a, b) => (a.t.toLowerCase().startsWith(term) ? 0 : 1) - (b.t.toLowerCase().startsWith(term) ? 0 : 1))
    .slice(0, 12);
  results.replaceChildren();
  if (!hits.length) {
    const li = document.createElement("li");
    li.className = "none";
    li.textContent = "Nothing matches “" + q.value.trim() + "”";
    results.append(li);
  }
  hits.forEach((e, i) => {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = "#" + e.h;
    a.textContent = e.t;
    const span = document.createElement("span");
    span.textContent = e.p;
    a.append(span);
    if (i === hot) a.classList.add("hot");
    a.addEventListener("click", () => { q.value = ""; results.hidden = true; });
    li.append(a);
    results.append(li);
  });
  results.hidden = false;
}
q.addEventListener("input", () => { hot = 0; renderResults(); });
q.addEventListener("keydown", ev => {
  const links = results.querySelectorAll("a");
  if (ev.key === "ArrowDown" && links.length) { hot = Math.min(hot + 1, links.length - 1); renderResults(); ev.preventDefault(); }
  else if (ev.key === "ArrowUp" && links.length) { hot = Math.max(hot - 1, 0); renderResults(); ev.preventDefault(); }
  else if (ev.key === "Enter" && links[hot]) { location.hash = links[hot].getAttribute("href"); q.value = ""; results.hidden = true; }
  else if (ev.key === "Escape") { q.value = ""; results.hidden = true; }
});
</script>
</body>
</html>
