[package]
name = "kindle-launcher"
description = "Kindle Launcher: a window that starts Dark Souls III with Kindle and shows the installed mods"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "kindle-launcher"
path = "src/main.rs"

[dependencies]
kindle-launch.workspace = true
windows.workspace = true
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
