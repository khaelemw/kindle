[package]
name = "kindle-ds3"
description = "Kindle: Lua scripting runtime for Dark Souls III (loaded into the game as kindle.dll)"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# The two-game test rig's switches and kindle.rig (src/rig.rs); never in a release build.
rig = []

[lib]
name = "kindle"
crate-type = ["cdylib"]

[dependencies]
kindle-paramdef.workspace = true
kindle-manifest.workspace = true
kindle-core.workspace = true
miniz_oxide = "0.8"
libz-rs-sys = { version = "0.5", default-features = false, features = ["rust-allocator", "std"] }
mlua.workspace = true
serde.workspace = true
serde_json.workspace = true
windows.workspace = true
hudhook = { version = "0.9", default-features = false, features = ["dx11", "imgui-tables-api"] }
ilhook = "2"
